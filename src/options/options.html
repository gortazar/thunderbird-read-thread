<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: message-box; padding: 1em; max-width: 46em; }
    label { display: block; margin: .8em 0; }
    input[type=number] { width: 5em; }
    .help { color: GrayText; }
    #saved { color: green; visibility: hidden; }
  </style>
</head>
<body>
  <h2 data-i18n="optTitle"></h2>
  <label><input type="checkbox" id="autoOnSend"> <span data-i18n="optAuto"></span></label>
  <label><span data-i18n="optDays"></span> <input type="number" id="backfillDays" min="1" max="3650"></label>
  <p id="saved" data-i18n="optSaved"></p>
  <p class="help" data-i18n="optHelp"></p>
  <script src="options.js"></script>
</body>
</html>
